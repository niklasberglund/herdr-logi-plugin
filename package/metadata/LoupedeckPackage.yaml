# Plugin manifest. Field reference:
# https://logitech.github.io/actions-sdk-docs/csharp/tutorial/plugin-structure/
type: plugin4

# Immutable identifier once published to the marketplace. Also names the log
# file (Herdr.log) and the reload deep link (loupedeck://plugin/Herdr/reload).
name: Herdr
displayName: Herdr Agents
description: Live status tiles and one-press focus for herdr workspaces and coding agents on the MX Keypad.

# The plugin's only version number: the build reads it from here.
version: 0.3.0

author: Niklas Berglund
copyright: Copyright © 2026 Niklas Berglund
# LogiPluginApi 6.4 targets .NET 10, which the Plugin Service runs from 6.4.
minimumLoupedeckVersion: 6.4

pluginFileName: HerdrPlugin.dll

# macOS only: the plugin raises the terminal with `open -a` and reads the
# herdr socket under ~/.config. The marketplace reads the commented-out
# Windows folder line below as "Windows unsupported" (confirmed by Logitech);
# without it the plugin is listed for Windows too. Keep it verbatim, and don't
# name that key anywhere else in this file.

# Location of plugin files on Windows (relative to the plugin base directory).
# This parameter is required to support Windows.
#pluginFolderWin: bin

# Location of plugin files on macOS (relative to the plugin base directory).
# This parameter is required to support Mac.
pluginFolderMac: bin

# The MX Keypad is the MX Creative Keypad hardware (USB 046d:c354) relaunched
# for developers; the Plugin Service knows it as MxCreativeKeypad.
# LoupedeckCtFamily covers the Loupedeck CT, Live and Live S, and the Razer
# Stream Controller. Only tested on Live S so far.
supportedDevices:
    - MxCreativeKeypad
    - LoupedeckCtFamily

pluginCapabilities:

license: MIT
licenseUrl: https://github.com/niklasberglund/herdr-logi-plugin/blob/main/LICENSE
supportPageUrl: https://github.com/niklasberglund/herdr-logi-plugin/issues
homePageUrl: https://github.com/niklasberglund/herdr-logi-plugin
